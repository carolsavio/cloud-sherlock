<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Sherlock - Encontre o serviço AWS certo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sherlock-header">
        <h1>Cloud Sherlock</h1>
        <p>Selecione as pistas que descrevem o que você precisa. O Sherlock investiga e aponta os serviços AWS mais prováveis.</p>
    </header>

    <main class="sherlock-container">
        <section>
            <div>
                <h2>
                    Pistas disponíveis
                </h2>
                <input type="text"
                        id="filtro-pistas"
                        placeholder="Filtrar pistas..."
                        aria-label="Filtrar pistas"
                >

            </div>
            <div class="acoes">
                <button id="btn-investigar" class="btn btn-primary">Investigar</button>
                <button id="btn-limpar" class="btn btn-secundary">Limpar pistas</button>
                <span id="contador" class="contador">0</span>
            </div>
            <section id="resultados" class="resultados" aria-live="polite"></section>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
